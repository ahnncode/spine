# Nightly database backup (the Supabase Free plan has no backups of its own).
#
# Dumps roles, schema and data with the Supabase CLI, encrypts the bundle with
# BACKUP_PASSPHRASE (the repo is public, and anyone signed in to GitHub can
# download artifacts from a public repo), and keeps it as an artifact for 14
# days. Run it by hand from the Actions tab any time.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Connect → Session pooler connection string,
#                       with the database password filled in. (The direct
#                       connection is IPv6-only and GitHub runners can't reach it.)
#   BACKUP_PASSPHRASE   A long random passphrase. Keep a copy in your password
#                       manager: without it the backups can't be opened.
#
# To restore: download the artifact, then
#   gpg --decrypt readread-backup-*.tar.gz.gpg | tar xz
#   and load roles.sql, schema.sql, data.sql in that order with psql.
name: Nightly backup

on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC, after the daily deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "SUPABASE_DB_URL or BACKUP_PASSPHRASE isn't set, so there's nothing to back up yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      # Pasted connection strings often carry a stray space or quotes, the
      # [YOUR-PASSWORD] brackets, or a password with @ # / ? % in it, which
      # breaks parsing. Tidy and encode the password; never print it.
      - name: Tidy the connection string
        if: steps.check.outputs.ready == 'true'
        env:
          RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          import re
          raw = os.environ["RAW"].strip()
          notes = []
          # Pull the connection string out of whatever was pasted around it
          # (DATABASE_URL=..., psql "...", quotes, a trailing line).
          m = re.search(r"postgres(?:ql)?://[^\s'\"]+", raw)
          if not m:
              low = raw.lower()
              if low.startswith("http"):
                  why = "it looks like the project link (https://...supabase.co), not the database connection string"
              elif low.startswith("eyj") or low.startswith("sb_"):
                  why = "it looks like an API key, not the database connection string"
              elif "host=" in low:
                  why = "it is in the host=... port=... format; copy the URI format instead"
              else:
                  why = "it has no postgresql:// connection string in it"
              raise SystemExit(f"SUPABASE_DB_URL isn't usable: {why}. In Supabase, click Connect, choose Session pooler, copy the URI that starts with postgresql://, and put your database password in it.")
          if m.group(0) != raw:
              notes.append("ignored text around the connection string")
          scheme, sep, rest = m.group(0).partition("://")
          creds, at, hostpart = rest.rpartition("@")
          if not at:
              raise SystemExit("SUPABASE_DB_URL has no user and password before the host. Copy the Session pooler string from Supabase > Connect.")
          user, colon, password = creds.partition(":")
          if not colon or not password:
              raise SystemExit("SUPABASE_DB_URL has no password in it.")
          if password.upper() == "[YOUR-PASSWORD]" or password.upper() == "YOUR-PASSWORD":
              raise SystemExit("SUPABASE_DB_URL still has the [YOUR-PASSWORD] placeholder. Put your database password there.")
          if password.startswith("[") and password.endswith("]"):
              password = password[1:-1]; notes.append("removed the square brackets around the password")
          decoded = urllib.parse.unquote(password)
          encoded = urllib.parse.quote(decoded, safe="")
          if encoded != password:
              notes.append("encoded special characters in the password")
          url = f"{scheme}://{user}:{encoded}@{hostpart}"
          print("::add-mask::" + url)
          print("::add-mask::" + encoded)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("DB_URL=" + url + "\n")
          host = hostpart.split("/")[0].split("@")[-1]
          print("Connecting to", host.split(":")[0], "as", user.split(".")[0] + (".…" if "." in user else ""))
          for n in notes:
              print("Fixed:", n)
          PY

      - name: Dump the database
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only
          ls -l backup

      - name: Encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="readread-backup-$(date -u +%Y-%m-%d)"
          tar czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 14
          if-no-files-found: error
