# readread ships every other day. Work lands on the dev branch; this moves it
# to main (which Netlify deploys) every second night, only if dev has
# something new. It wakes up nightly and skips the nights in between.
# Run it by hand from the Actions tab to ship right away, on any day.
name: Deploy

on:
  schedule:
    - cron: "7 9 * * *" # 09:07 UTC = 2:07am Mountain / 4:07am Eastern (an hour later in summer); every other night ships
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - name: Anything new on dev?
        id: check
        run: |
          git fetch origin dev
          # Every other night: ship when the number of days since 1970 is even
          # (Nov 15, 2026 was a ship night). Counting days this way alternates
          # cleanly across month and year ends. Manual runs always ship.
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date -u +%s) / 86400 % 2 )) -ne 0 ]; then
            echo "Off night. Next deploy is tomorrow night."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git rev-list main..origin/dev)" ]; then
            echo "Nothing new on dev. No deploy."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "Shipping:"; git log --oneline main..origin/dev
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Move dev onto main (locally)
        if: steps.check.outputs.ship == 'true'
        run: |
          git config user.name "readread deploy"
          git config user.email "noreply@github.com"
          git merge --ff-only origin/dev || git merge --no-edit origin/dev
      # Nothing goes live unless the tests pass and the app builds.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.ship == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Test and build
        if: steps.check.outputs.ship == 'true'
        env:
          # Placeholders: this build only checks the code compiles. Netlify does the real build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Push to main
        if: steps.check.outputs.ship == 'true'
        run: git push origin main
